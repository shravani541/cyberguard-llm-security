# ─────────────────────────────────────────────────────────────
# Docker Compose — Full CyberGuard Stack
#
# Services:
#   cyberguard-api  — vLLM + FastAPI inference server (GPU)
#   mlflow          — Experiment tracking UI
#   mlflow-db       — PostgreSQL backend for MLflow
#   nginx           — Reverse proxy + rate limiting
#
# Usage:
#   docker compose up -d            # Start all services
#   docker compose logs -f          # Follow logs
#   docker compose down             # Stop all
# ─────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── CyberGuard Inference API ─────────────────────────────
  cyberguard-api:
    build:
      context: ..
      dockerfile: serving/Dockerfile
    container_name: cyberguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your fine-tuned merged model here
      - ${MODEL_PATH:-./outputs/merged_model}:/app/model:ro
    environment:
      - MODEL_PATH=/app/model
      - MAX_MODEL_LEN=4096
      - GPU_MEMORY_UTIL=0.85
      - TENSOR_PARALLEL_SIZE=1
      - MAX_BATCH_SIZE=8
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - cyberguard-net

  # ── MLflow Tracking Server ────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: mlflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow_pass@mlflow-db:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow_pass@mlflow-db:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks:
      - cyberguard-net

  # ── MLflow PostgreSQL Backend ─────────────────────────────
  mlflow-db:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow_pass
    volumes:
      - mlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberguard-net

  # ── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cyberguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cyberguard-api
      - mlflow
    networks:
      - cyberguard-net

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mlflow-artifacts:
  mlflow-pgdata:

# ── Networks ──────────────────────────────────────────────────
networks:
  cyberguard-net:
    driver: bridge
